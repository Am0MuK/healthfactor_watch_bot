[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hfwb"
version = "0.1.0"
description = "DeFi Health Factor Telegram Watch Bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
]

[project.scripts]
hfwb = "hfwb.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hfwb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.setuptools.package-data]
hfwb = ["markets.json"]
